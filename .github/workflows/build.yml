name: Build vLLM stack (torch/triton/vLLM/AITER)

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    # Same rationale as therock-gfx1151: GitHub's hard cap is 6h, and this
    # build (PyTorch + Triton + vLLM + AITER from source) won't fit in one
    # run. actions/cache + should_skip_step lets a re-triggered run resume.
    timeout-minutes: 360
    steps:
    - uses: actions/checkout@v4

    - name: Free up runner disk space
      uses: jlumbroso/free-disk-space@main
      with:
        tool-cache: false
        android: true
        dotnet: true
        haskell: true
        large-packages: true
        swap-storage: false

    - name: Get version
      id: version
      run: echo "tag=$(cat .tags)" >> $GITHUB_OUTPUT

    - name: Install build prerequisites
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq \
          ca-certificates curl git gnupg software-properties-common \
          clang lld cmake ninja-build gfortran patchelf automake libtool libtool-bin \
          bison flex xxd scons meson \
          libvulkan-dev mesa-vulkan-drivers python3-dev python3-pip python3-venv \
          build-essential lsb-release procps \
          libgl1-mesa-dev libglx-dev libopengl-dev libsqlite3-dev libdrm-dev \
          protobuf-compiler libprotobuf-dev libsleef-dev

    - name: Install Clang 21 (TheRock/vLLM build requires >= 21)
      run: |
        curl -fsSL https://apt.llvm.org/llvm.sh -o /tmp/llvm.sh
        sudo bash /tmp/llvm.sh 21
        sudo update-alternatives --install /usr/bin/clang clang /usr/bin/clang-21 210
        sudo update-alternatives --install /usr/bin/clang++ clang++ /usr/bin/clang++-21 210
        sudo update-alternatives --install /usr/bin/lld lld /usr/bin/lld-21 210
        sudo update-alternatives --set clang /usr/bin/clang-21
        sudo update-alternatives --set clang++ /usr/bin/clang++-21
        sudo update-alternatives --set lld /usr/bin/lld-21

    - name: Install lit (LLVM Integrated Tester)
      run: pip3 install --break-system-packages --no-cache-dir lit

    - name: Prepare VLLM_DIR
      run: |
        sudo mkdir -p /opt/src/vllm
        sudo chown "$(id -u):$(id -g)" /opt/src/vllm
        mkdir -p /opt/src/vllm/local

    # This is the piece that replaces therock-gfx1151's steps 1-4: instead
    # of building TheRock ourselves, install AMD's own official CI-built
    # artifacts for the therock-7.14 tag commit (418cd5f) directly from
    # their public S3 bucket (therock-ci-artifacts, anonymous access).
    # Deliberately decoupled from sebt3/therock-gfx1151 — that repo (if/when
    # it produces a real custom-patched build) is for behavior-changing
    # patches later, not a prerequisite for this one. Component flags below
    # mirror the THEROCK_ENABLE_* choices in therock-gfx1151's build-vllm.sh
    # (media/profiler/rocalution/rocwmma/hiptensor/mpi off, blas/rand/prim/
    # rccl/libhipcxx on — PyTorch's USE_RCCL=1 ABI needs rccl even though
    # this is single-iGPU).
    #
    # therock_run_id pins the exact official CI run that built this tag
    # (found via build_tools/find_artifacts_for_commit.py against
    # ROCm/TheRock's own multi_arch_ci.yml workflow for commit 418cd5f).
    - name: Fetch official ROCm 7.14 SDK (gfx1151) from ROCm/TheRock CI artifacts
      env:
        THEROCK_RUN_ID: "29052575219"
      run: |
        set -euo pipefail
        pip3 install --break-system-packages --no-cache-dir boto3 pyzstd
        git clone --depth 1 --branch therock-7.14 --filter=blob:none --sparse https://github.com/ROCm/TheRock.git /tmp/therock-tools
        git -C /tmp/therock-tools sparse-checkout set build_tools cmake
        python3 /tmp/therock-tools/build_tools/install_rocm_from_artifacts.py \
          --run-id "${THEROCK_RUN_ID}" \
          --run-github-repo ROCm/TheRock \
          --amdgpu-family gfx1151 \
          --no-rocdecode --no-rocjpeg \
          --no-rocprofiler-sdk --no-rocprofiler-compute --no-rocprofiler-systems --no-rocprofiler-systems-examples \
          --no-rocalution --no-rocwmma --no-hiptensor \
          --no-mpi --no-aqlprofile --no-hipdnn --no-hipdnn-integration-tests --no-hipdnn-samples \
          --output-dir /opt/src/vllm/local
        rm -rf /tmp/therock-tools

    # Mirrors validate_rocm()'s compiler symlink setup (step 4, which we
    # skip via --step 5 below) — downstream steps (PyTorch, Triton builds)
    # look for `cc`/`c++` on PATH and expect them to resolve to amdclang.
    - name: Recreate ROCm compiler symlinks
      run: |
        LLVM_BIN=/opt/src/vllm/local/lib/llvm/bin
        [ -x "${LLVM_BIN}/amdclang" ] || { echo "::error::amdclang not found after extracting ROCm SDK"; exit 1; }
        [ -e "${LLVM_BIN}/cc" ]  || ln -s amdclang "${LLVM_BIN}/cc"
        [ -e "${LLVM_BIN}/c++" ] || ln -s amdclang++ "${LLVM_BIN}/c++"

    - name: Cache build tree
      uses: actions/cache@v4
      with:
        path: /opt/src/vllm
        key: stack-torch-build-${{ hashFiles('vllm-packages.yaml', 'patches/*.patch') }}-${{ github.run_id }}
        restore-keys: |
          stack-torch-build-${{ hashFiles('vllm-packages.yaml', 'patches/*.patch') }}-

    # --step 5 skips TheRock (steps 1-4, replaced above by the fetched
    # artifact) and starts at build_aocl_utils. total_steps in
    # vllm-packages.yaml is capped at 32 (export_source_wheels), stopping
    # before the llama.cpp/Lemonade phase (33-36) which this repo does not
    # build. Leaves ~15min margin under the 6h cap for cache-save.
    #
    # THEROCK_CI_GENERIC_CPU=1: vllm-env.sh (sourced inside build-vllm.sh)
    # unconditionally forces -march=native -mavx512f/-mavx512dq/-mavx512vl/
    # -mavx512bw for the original Zen 5 dev box, via CMAKE_C_FLAGS_RELEASE -
    # a plain job-level CFLAGS override here has no effect since cmake
    # ignores bare CFLAGS and vllm-env.sh's export happens later anyway.
    # See vllm-env.sh for the actual gate.
    #
    # BUILD_CUSTOM_PROTOBUF=0: even with our own flags clean (verified: the
    # actual CXX flags line logged no longer has -march=native/-mavx512*),
    # PyTorch's *freshly-built, vendored* protoc still SIGILL'd identically
    # ("Illegal instruction (core dumped)") generating onnx protos, three
    # times across three separate runner instances - not our compile flags.
    # This matches a documented, longstanding GitHub-acknowledged
    # inconsistency in the runner fleet (actions/runner-images#3389: some
    # hosts report AVX512 via cpuid without it being reliably usable), most
    # likely hit via runtime cpuid dispatch inside protobuf/absl rather than
    # anything decided by our own compile-time flags - so no CFLAGS fixes
    # it. Sidestep entirely: use apt's protobuf-compiler (a normal,
    # conservatively-built Debian package) instead of building protoc from
    # source.
    # NO_AVX2=1, USE_FBGEMM=0: the protobuf fix got much further (1015/7428
    # vs ~656 before) but hit the *same* Illegal instruction signature in a
    # completely unrelated vendored tool - SLEEF's mkrename codegen utility,
    # generating AVX/AVX2/AVX128 header variants ("Illegal instruction (core
    # dumped)" x3, sleeflibm_AVX2128.h.tmp/AVX2.h.tmp/AVX.h.tmp). This is a
    # second independent hit of the same GH-runner-fleet AVX inconsistency
    # (actions/runner-images#3389) in a totally different codebase, so
    # per-tool substitution doesn't scale - go broader instead: don't build
    # the AVX-family CPU capability tiers at all. fbgemm hard-requires AVX2
    # (a known standalone crash source per pytorch/pytorch build reports for
    # non-AVX2 hosts). None of this affects gfx1151 runtime perf - real
    # inference compute happens on the GPU via HIP kernels, not these
    # host-CPU vectorized math paths.
    # USE_SYSTEM_SLEEF=1: NO_AVX2 didn't stop SLEEF's own build from trying
    # to generate all 4 header variants (AVX2, AVX, AVX512F, AVX2128) via
    # mkrename regardless - same crash, unaffected. mkrename is a generic
    # C header-rename generator with no inherent SIMD need of its own; it
    # crashing points at SLEEF's *own* internal CPU-capability compile
    # probes accepting -mavx2/-mavx512f because cpuid reports them, not at
    # anything our global CFLAGS reach (same class of problem as protobuf,
    # different codebase). Sidestep the same way: apt's libsleef-dev
    # instead of building SLEEF from source at all.
    - name: Build torch/triton/vLLM/AITER
      env:
        THEROCK_CI_GENERIC_CPU: "1"
        BUILD_CUSTOM_PROTOBUF: "0"
        NO_AVX2: "1"
        USE_FBGEMM: "0"
        USE_SYSTEM_SLEEF: "1"
      run: timeout 345m ./build-vllm.sh --step 5 || true

    - name: Check build completed
      id: check
      run: |
        if ls /opt/src/vllm/wheels/vllm-*.whl >/dev/null 2>&1; then
          echo "done=true" >> $GITHUB_OUTPUT
        else
          echo "done=false" >> $GITHUB_OUTPUT
          echo "::warning::Build did not finish in this run; re-run the workflow to resume from cache."
        fi

    - name: Package
      if: steps.check.outputs.done == 'true'
      run: tar czf stack-torch-gfx1151-${{ steps.version.outputs.tag }}.tar.gz -C /opt/src/vllm wheels

    - name: Publish release
      if: steps.check.outputs.done == 'true'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.version.outputs.tag }}
        files: stack-torch-gfx1151-${{ steps.version.outputs.tag }}.tar.gz
